<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산기 - My Website</title>
<meta name="description" content="iOS 스타일 사칙연산 웹 계산기. 키보드 입력 지원.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="My Website">
<meta property="og:title" content="🧮 웹 계산기">
<meta property="og:description" content="iOS 스타일의 사칙연산 계산기. 키보드로도 조작 가능해요.">
<meta property="og:url" content="https://pgakim24-commits.github.io/my-website/calculator.html">
<meta property="og:locale" content="ko_KR">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="🧮 웹 계산기">
<meta name="twitter:description" content="iOS 스타일 사칙연산 계산기">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .calculator {
    width: 320px;
    background: #1c1c1e;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .display {
    background: #000;
    color: #fff;
    text-align: right;
    padding: 24px 16px;
    border-radius: 12px;
    margin-bottom: 16px;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .expr { font-size: 16px; color: #888; min-height: 20px; word-break: break-all; }
  .result { font-size: 40px; font-weight: 300; word-break: break-all; }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    height: 60px;
    border: none;
    border-radius: 50%;
    font-size: 22px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.1s;
    color: #fff;
  }
  button:active { transform: scale(0.95); }
  .num { background: #333; }
  .num:hover { background: #444; }
  .op { background: #ff9500; }
  .op:hover { background: #ffaa33; }
  .op.active { background: #fff; color: #ff9500; }
  .fn { background: #a5a5a5; color: #000; }
  .fn:hover { background: #b8b8b8; }
  .span-2 { grid-column: span 2; border-radius: 30px; }
</style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys">
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="negate">±</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>

      <button class="num" data-num="7">7</button>
      <button class="num" data-num="8">8</button>
      <button class="num" data-num="9">9</button>
      <button class="op" data-op="*">×</button>

      <button class="num" data-num="4">4</button>
      <button class="num" data-num="5">5</button>
      <button class="num" data-num="6">6</button>
      <button class="op" data-op="-">−</button>

      <button class="num" data-num="1">1</button>
      <button class="num" data-num="2">2</button>
      <button class="num" data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="num span-2" data-num="0">0</button>
      <button class="num" data-num=".">.</button>
      <button class="op" data-action="equals">=</button>
    </div>
  </div>

<script>
(() => {
  const exprEl = document.getElementById('expr');
  const resultEl = document.getElementById('result');

  let current = '0';
  let previous = null;
  let operator = null;
  let justEvaluated = false;

  const format = (n) => {
    if (n === 'Error') return n;
    const num = Number(n);
    if (!isFinite(num)) return 'Error';
    const str = num.toString();
    if (str.length > 12) return num.toPrecision(10);
    return str;
  };

  const compute = (a, b, op) => {
    a = parseFloat(a); b = parseFloat(b);
    switch (op) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b === 0 ? 'Error' : a / b;
    }
  };

  const updateDisplay = () => {
    resultEl.textContent = format(current);
    if (previous !== null && operator) {
      const opSym = { '+': '+', '-': '−', '*': '×', '/': '÷' }[operator];
      exprEl.textContent = `${format(previous)} ${opSym}`;
    } else {
      exprEl.textContent = '';
    }
  };

  const inputNum = (n) => {
    if (current === 'Error') current = '0';
    if (justEvaluated) { current = '0'; justEvaluated = false; }
    if (n === '.') {
      if (!current.includes('.')) current += '.';
    } else {
      current = current === '0' ? n : current + n;
    }
    updateDisplay();
  };

  const inputOp = (op) => {
    if (current === 'Error') return;
    if (previous !== null && operator && !justEvaluated) {
      const r = compute(previous, current, operator);
      previous = r.toString();
      current = r.toString();
    } else {
      previous = current;
    }
    operator = op;
    justEvaluated = false;
    current = '0';
    updateDisplay();
    // keep previous shown
    resultEl.textContent = format(previous);
  };

  const equals = () => {
    if (previous === null || !operator) return;
    const r = compute(previous, current, operator);
    current = r.toString();
    previous = null;
    operator = null;
    justEvaluated = true;
    updateDisplay();
  };

  const clear = () => {
    current = '0'; previous = null; operator = null; justEvaluated = false;
    updateDisplay();
  };

  const negate = () => {
    if (current === '0' || current === 'Error') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    updateDisplay();
  };

  const percent = () => {
    if (current === 'Error') return;
    current = (parseFloat(current) / 100).toString();
    updateDisplay();
  };

  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.num) inputNum(btn.dataset.num);
      else if (btn.dataset.op) inputOp(btn.dataset.op);
      else if (btn.dataset.action === 'equals') equals();
      else if (btn.dataset.action === 'clear') clear();
      else if (btn.dataset.action === 'negate') negate();
      else if (btn.dataset.action === 'percent') percent();
    });
  });

  document.addEventListener('keydown', (e) => {
    if (/[0-9.]/.test(e.key)) inputNum(e.key);
    else if (['+', '-', '*', '/'].includes(e.key)) inputOp(e.key);
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
    else if (e.key === 'Escape') clear();
    else if (e.key === 'Backspace') {
      if (justEvaluated || current === 'Error') return clear();
      current = current.length > 1 ? current.slice(0, -1) : '0';
      updateDisplay();
    }
  });

  updateDisplay();
})();
</script>
</body>
</html>
