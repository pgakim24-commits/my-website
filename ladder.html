<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사다리 게임 - My Website</title>
<meta name="description" content="참가자와 결과를 입력하면 사다리를 자동으로 만들어 결과를 추첨해주는 클래식 사다리 게임.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="My Website">
<meta property="og:title" content="🎢 사다리 게임">
<meta property="og:description" content="참가자와 결과를 입력하고 사다리를 타보세요. 2~8명까지 지원하는 클래식 사다리.">
<meta property="og:url" content="https://pgakim24-commits.github.io/my-website/ladder.html">
<meta property="og:locale" content="ko_KR">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="🎢 사다리 게임">
<meta name="twitter:description" content="참가자·결과를 입력하면 자동으로 사다리를 만들어 추첨해줍니다.">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  color: #1c1c1e;
  padding: 24px 16px 48px;
}
.container { max-width: 880px; margin: 0 auto; }
header { text-align: center; color: #fff; margin-bottom: 24px; text-shadow: 0 2px 8px rgba(0,0,0,0.18); }
header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
header p { font-size: 15px; opacity: 0.95; }

.card {
  background: #fff;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  margin-bottom: 18px;
}
.row-label { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 10px; letter-spacing: 0.5px; }
.count-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.count-btn {
  flex: 1;
  min-width: 44px;
  padding: 10px 0;
  border: 2px solid #f2f2f7;
  background: #f7f7fa;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  color: #333;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.count-btn:hover { border-color: #fda085; }
.count-btn.active {
  background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
  color: #fff;
  border-color: transparent;
}
.input-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px;
  margin-bottom: 18px;
}
.input-grid input {
  padding: 10px 12px;
  border: 2px solid #e5e5ea;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  transition: border 0.15s;
  font-family: inherit;
  width: 100%;
}
.input-grid input:focus { border-color: #fda085; }
.input-grid.results input { background: #fffaf0; }

.btn {
  display: inline-block;
  padding: 12px 22px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.btn-primary {
  background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
  color: #fff;
  box-shadow: 0 4px 14px rgba(253,160,133,0.45);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(253,160,133,0.55); }
.btn-secondary {
  background: #f2f2f7;
  color: #1c1c1e;
}
.btn-secondary:hover { background: #e5e5ea; }
.btn-ghost {
  background: transparent;
  color: #555;
  padding: 10px 14px;
}
.btn-ghost:hover { color: #1c1c1e; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1; min-width: 110px; }

.canvas-wrap {
  position: relative;
  width: 100%;
  overflow-x: auto;
  background: #fff;
  border-radius: 14px;
  padding: 12px;
}
canvas { display: block; margin: 0 auto; max-width: 100%; }

.players-row, .results-row {
  display: grid;
  gap: 4px;
  margin-bottom: 6px;
}
.player-chip, .result-chip {
  text-align: center;
  padding: 8px 6px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  word-break: break-all;
  line-height: 1.2;
}
.player-chip { background: #f5f5f7; color: #1c1c1e; }
.player-chip:hover { background: #fda085; color: #fff; }
.player-chip.done { opacity: 0.55; }
.result-chip {
  background: #fff7e0;
  color: #5c4400;
  border: 2px solid #ffd9b3;
  cursor: default;
}
.result-chip.revealed { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #fff; border-color: transparent; }

.summary {
  margin-top: 16px;
  padding: 14px 16px;
  background: #fff7e0;
  border-radius: 12px;
  font-size: 14px;
  color: #5c4400;
  line-height: 1.7;
  display: none;
}
.summary.show { display: block; }
.summary strong { color: #1c1c1e; }

.hint {
  font-size: 12px;
  color: #888;
  margin-top: 8px;
  text-align: center;
}

.back {
  display: block;
  text-align: center;
  margin-top: 24px;
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.18);
}
.back:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎢 사다리 게임</h1>
    <p>참가자와 결과를 입력하고 사다리를 타보세요</p>
  </header>

  <div class="card" id="setupCard">
    <div class="row-label">참가자 수</div>
    <div class="count-buttons" id="countButtons"></div>

    <div class="row-label">참가자 이름</div>
    <div class="input-grid" id="namesGrid"></div>

    <div class="row-label">결과 (꽝, 커피, 청소... 자유롭게)</div>
    <div class="input-grid results" id="resultsGrid"></div>

    <button class="btn btn-primary" id="generateBtn" style="width:100%; padding:14px;">🎲 사다리 만들기</button>
  </div>

  <div class="card" id="gameCard" hidden>
    <div class="players-row" id="playersRow"></div>
    <div class="canvas-wrap">
      <canvas id="ladder"></canvas>
    </div>
    <div class="results-row" id="resultsRow"></div>
    <div class="hint">참가자 이름을 클릭하면 해당 경로가 추적됩니다</div>
    <div class="summary" id="summary"></div>
    <div class="actions" style="margin-top:16px;">
      <button class="btn btn-primary" id="startAllBtn">▶ 전체 추첨</button>
      <button class="btn btn-secondary" id="regenerateBtn">🔄 사다리 다시 만들기</button>
      <button class="btn btn-ghost" id="backBtn">← 처음으로</button>
    </div>
  </div>

  <a href="index.html" class="back">← 메인으로</a>
</div>

<script>
(() => {
  const MIN_N = 2, MAX_N = 8;
  const ROWS = 12;
  const COL_W = 80;
  const ROW_H = 36;
  const PAD_Y = 16;

  const COLORS = ['#ff6b6b', '#ffa94d', '#ffd43b', '#51cf66', '#22b8cf', '#4dabf7', '#9775fa', '#f06595'];
  const DEFAULT_NAMES = ['플레이어1', '플레이어2', '플레이어3', '플레이어4', '플레이어5', '플레이어6', '플레이어7', '플레이어8'];
  const DEFAULT_RESULTS = ['🎉 당첨', '꽝', '꽝', '꽝', '꽝', '커피', '꽝', '청소'];

  const countButtons = document.getElementById('countButtons');
  const namesGrid = document.getElementById('namesGrid');
  const resultsGrid = document.getElementById('resultsGrid');
  const setupCard = document.getElementById('setupCard');
  const gameCard = document.getElementById('gameCard');
  const playersRow = document.getElementById('playersRow');
  const resultsRow = document.getElementById('resultsRow');
  const canvas = document.getElementById('ladder');
  const ctx = canvas.getContext('2d');
  const summary = document.getElementById('summary');

  let n = 4;
  let names = [], results = [];
  let rungs = []; // rungs[row][col] = true if rung between col and col+1 at row
  let mappings = []; // mappings[startCol] = endCol
  let pathTrails = []; // pathTrails[startCol] = { progress: 0..1, color }
  let animating = false;

  const buildSetup = () => {
    countButtons.innerHTML = '';
    for (let i = MIN_N; i <= MAX_N; i++) {
      const btn = document.createElement('button');
      btn.className = 'count-btn' + (i === n ? ' active' : '');
      btn.textContent = i;
      btn.dataset.n = i;
      btn.addEventListener('click', () => {
        n = i;
        document.querySelectorAll('.count-btn').forEach(b => b.classList.toggle('active', +b.dataset.n === n));
        renderInputs();
      });
      countButtons.appendChild(btn);
    }
    renderInputs();
  };

  const renderInputs = () => {
    const prevNames = Array.from(namesGrid.querySelectorAll('input')).map(i => i.value);
    const prevResults = Array.from(resultsGrid.querySelectorAll('input')).map(i => i.value);
    namesGrid.innerHTML = '';
    resultsGrid.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const ni = document.createElement('input');
      ni.placeholder = `참가자 ${i+1}`;
      ni.value = prevNames[i] !== undefined ? prevNames[i] : DEFAULT_NAMES[i];
      ni.maxLength = 8;
      namesGrid.appendChild(ni);
      const ri = document.createElement('input');
      ri.placeholder = `결과 ${i+1}`;
      ri.value = prevResults[i] !== undefined ? prevResults[i] : DEFAULT_RESULTS[i];
      ri.maxLength = 8;
      resultsGrid.appendChild(ri);
    }
  };

  const generateRungs = () => {
    rungs = Array.from({ length: ROWS }, () => Array(n - 1).fill(false));
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < n - 1; c++) {
        if (c > 0 && rungs[r][c - 1]) continue;
        if (Math.random() < 0.45) rungs[r][c] = true;
      }
    }
  };

  const computeMappings = () => {
    mappings = [];
    for (let start = 0; start < n; start++) {
      let col = start;
      for (let r = 0; r < ROWS; r++) {
        if (col > 0 && rungs[r][col - 1]) col -= 1;
        else if (col < n - 1 && rungs[r][col]) col += 1;
      }
      mappings.push(col);
    }
  };

  const setupCanvas = () => {
    const dpr = window.devicePixelRatio || 1;
    const width = COL_W * (n - 1) + 40;
    const height = ROW_H * ROWS + PAD_Y * 2;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { width, height };
  };

  const colX = (c) => 20 + c * COL_W;

  const drawLadder = (size) => {
    ctx.clearRect(0, 0, size.width, size.height);
    // verticals
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let c = 0; c < n; c++) {
      ctx.strokeStyle = '#d0d0d8';
      ctx.beginPath();
      ctx.moveTo(colX(c), PAD_Y);
      ctx.lineTo(colX(c), PAD_Y + ROW_H * ROWS);
      ctx.stroke();
    }
    // rungs
    ctx.strokeStyle = '#a0a0a8';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < n - 1; c++) {
        if (rungs[r][c]) {
          const y = PAD_Y + (r + 0.5) * ROW_H;
          ctx.beginPath();
          ctx.moveTo(colX(c), y);
          ctx.lineTo(colX(c + 1), y);
          ctx.stroke();
        }
      }
    }
  };

  const pathPoints = (start) => {
    const pts = [{ x: colX(start), y: PAD_Y }];
    let col = start;
    for (let r = 0; r < ROWS; r++) {
      const ry = PAD_Y + (r + 0.5) * ROW_H;
      if (col > 0 && rungs[r][col - 1]) {
        pts.push({ x: colX(col), y: ry });
        col -= 1;
        pts.push({ x: colX(col), y: ry });
      } else if (col < n - 1 && rungs[r][col]) {
        pts.push({ x: colX(col), y: ry });
        col += 1;
        pts.push({ x: colX(col), y: ry });
      }
    }
    pts.push({ x: colX(col), y: PAD_Y + ROWS * ROW_H });
    return pts;
  };

  const segmentLengths = (pts) => {
    const segs = [];
    let total = 0;
    for (let i = 1; i < pts.length; i++) {
      const dx = pts[i].x - pts[i-1].x, dy = pts[i].y - pts[i-1].y;
      const len = Math.hypot(dx, dy);
      segs.push(len); total += len;
    }
    return { segs, total };
  };

  const drawTrail = (trail) => {
    const { pts, segs, total, progress, color } = trail;
    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    let drawn = 0;
    const target = total * progress;
    for (let i = 1; i < pts.length; i++) {
      const segLen = segs[i-1];
      if (drawn + segLen <= target) {
        ctx.lineTo(pts[i].x, pts[i].y);
        drawn += segLen;
      } else {
        const remain = target - drawn;
        const t = remain / segLen;
        const ex = pts[i-1].x + (pts[i].x - pts[i-1].x) * t;
        const ey = pts[i-1].y + (pts[i].y - pts[i-1].y) * t;
        ctx.lineTo(ex, ey);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(ex, ey, 7, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        return;
      }
    }
    ctx.stroke();
  };

  const renderFrame = () => {
    const size = { width: canvas.style.width.replace('px',''), height: canvas.style.height.replace('px','') };
    drawLadder({ width: +size.width, height: +size.height });
    pathTrails.forEach(t => t && drawTrail(t));
  };

  const animateTrail = (startCol, color) => {
    return new Promise(resolve => {
      const pts = pathPoints(startCol);
      const { segs, total } = segmentLengths(pts);
      const trail = { pts, segs, total, progress: 0, color };
      pathTrails[startCol] = trail;
      const duration = 1200 + total * 1.2;
      const t0 = performance.now();
      const step = (t) => {
        const p = Math.min(1, (t - t0) / duration);
        trail.progress = p;
        renderFrame();
        if (p < 1) requestAnimationFrame(step);
        else resolve();
      };
      requestAnimationFrame(step);
    });
  };

  const runOne = async (startCol) => {
    if (animating) return;
    animating = true;
    pathTrails[startCol] = null;
    renderFrame();
    await animateTrail(startCol, COLORS[startCol % COLORS.length]);
    revealOne(startCol);
    animating = false;
  };

  const runAll = async () => {
    if (animating) return;
    animating = true;
    pathTrails = new Array(n).fill(null);
    document.querySelectorAll('.player-chip').forEach(el => el.classList.remove('done'));
    document.querySelectorAll('.result-chip').forEach(el => el.classList.remove('revealed'));
    summary.classList.remove('show');
    summary.innerHTML = '';
    renderFrame();
    await Promise.all(Array.from({ length: n }, (_, i) => animateTrail(i, COLORS[i % COLORS.length])));
    for (let i = 0; i < n; i++) revealOne(i);
    showSummary();
    animating = false;
  };

  const revealOne = (startCol) => {
    const end = mappings[startCol];
    const playerEl = playersRow.children[startCol];
    const resultEl = resultsRow.children[end];
    if (playerEl) playerEl.classList.add('done');
    if (resultEl) resultEl.classList.add('revealed');
  };

  const showSummary = () => {
    const lines = mappings.map((end, start) => `<strong>${escapeHTML(names[start])}</strong> → ${escapeHTML(results[end])}`);
    summary.innerHTML = '🎯 결과<br>' + lines.join('<br>');
    summary.classList.add('show');
  };

  const escapeHTML = (s) => s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

  const renderGame = () => {
    playersRow.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    resultsRow.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    playersRow.innerHTML = '';
    resultsRow.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const p = document.createElement('div');
      p.className = 'player-chip';
      p.textContent = names[i];
      p.style.color = '#fff';
      p.style.background = COLORS[i % COLORS.length];
      p.addEventListener('click', () => runOne(i));
      playersRow.appendChild(p);
      const r = document.createElement('div');
      r.className = 'result-chip';
      r.textContent = results[i];
      resultsRow.appendChild(r);
    }
    const size = setupCanvas();
    drawLadder(size);
    pathTrails = new Array(n).fill(null);
    summary.classList.remove('show');
    summary.innerHTML = '';
  };

  const onGenerate = () => {
    names = Array.from(namesGrid.querySelectorAll('input')).map((el, i) => el.value.trim() || `참가자${i+1}`);
    results = Array.from(resultsGrid.querySelectorAll('input')).map((el, i) => el.value.trim() || `결과${i+1}`);
    generateRungs();
    computeMappings();
    setupCard.hidden = true;
    gameCard.hidden = false;
    renderGame();
  };

  const onRegenerate = () => {
    if (animating) return;
    generateRungs();
    computeMappings();
    renderGame();
  };

  const onBack = () => {
    if (animating) return;
    setupCard.hidden = false;
    gameCard.hidden = true;
  };

  document.getElementById('generateBtn').addEventListener('click', onGenerate);
  document.getElementById('regenerateBtn').addEventListener('click', onRegenerate);
  document.getElementById('startAllBtn').addEventListener('click', runAll);
  document.getElementById('backBtn').addEventListener('click', onBack);

  buildSetup();
})();
</script>
</body>
</html>
